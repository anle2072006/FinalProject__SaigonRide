services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saigonride_db
    platform: linux/amd64
    environment:
      SA_PASSWORD: "YourStrong@Password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  app:
    build: .
    container_name: saigonride_app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=SaigonRideDB;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql_data: